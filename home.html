<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Home - Chat App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background:#075e54; color:white; padding:15px; display:flex; justify-content:space-between;">
        <span id="my-display-name">読み込み中...</span>
        <button id="btn-logout" style="background:none; border:1px solid white; color:white;">ログアウト</button>
    </header>
    <div id="user-list" style="padding:10px;"></div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, onSnapshot, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                location.href = "index.html";
            } else {
                const userSnap = await getDoc(doc(db, "users", user.uid));
                if (userSnap.exists()) {
                    document.getElementById("my-display-name").innerText = userSnap.data().name + " さん";
                }
                loadUserList(user.uid);
            }
        });

        function loadUserList(myUid) {
            onSnapshot(collection(db, "users"), (snapshot) => {
                const list = document.getElementById("user-list");
                list.innerHTML = "";
                snapshot.forEach(uDoc => {
                    const data = uDoc.data();
                    if (data.uid === myUid) return;
                    const div = document.createElement("div");
                    div.style = "padding:15px; background:white; border-bottom:1px solid #eee; cursor:pointer;";
                    div.innerHTML = `<strong>${data.name}</strong> (@${data.username})`;
                    div.onclick = () => location.href = `chat.html?id=${data.uid}`;
                    list.appendChild(div);
                });
            });
        }
        document.getElementById("btn-logout").onclick = () => signOut(auth);
    </script>
</body>
</html>
