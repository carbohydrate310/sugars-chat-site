<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Chat Room</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background:#075e54; color:white; padding:15px;">
        <button onclick="location.href='home.html'">←</button>
        <span id="chat-target-name">相手の名前</span>
    </header>
    <div id="msg-list" style="height:450px; overflow-y:auto; background:#e5ddd5; padding:10px;"></div>
    <div style="padding:10px; display:flex;">
        <input type="text" id="msg-input" style="flex:1;">
        <button id="btn-send">送信</button>
    </div>

    <script type="module">
        import { auth, db } from "./firebase-config.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { collection, addDoc, query, orderBy, onSnapshot, where, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const friendId = new URLSearchParams(window.location.search).get("id");

        onAuthStateChanged(auth, async (user) => {
            if (!user) location.href = "index.html";
            if (friendId) {
                const snap = await getDoc(doc(db, "users", friendId));
                if (snap.exists()) document.getElementById("chat-target-name").innerText = snap.data().name;
                loadMessages(user.uid, friendId);
            }
        });

        async function send() {
            const text = document.getElementById("msg-input").value;
            if (!text.trim()) return;
            await addDoc(collection(db, "direct_messages"), {
                text, senderId: auth.currentUser.uid, receiverId: friendId,
                members: [auth.currentUser.uid, friendId].sort(),
                createdAt: serverTimestamp()
            });
            document.getElementById("msg-input").value = "";
        }
        document.getElementById("btn-send").onclick = send;

        function loadMessages(myId, friendId) {
            const q = query(collection(db, "direct_messages"), 
                where("members", "==", [myId, friendId].sort()), orderBy("createdAt"));
            onSnapshot(q, (snapshot) => {
                const list = document.getElementById("msg-list");
                list.innerHTML = "";
                snapshot.forEach(mDoc => {
                    const d = mDoc.data();
                    const isMe = d.senderId === myId;
                    const div = document.createElement("div");
                    div.style = `margin:5px; text-align:${isMe?'right':'left'};`;
                    div.innerHTML = `<div style="display:inline-block; padding:10px; background:${isMe?'#dcf8c6':'white'}; border-radius:10px;">${d.text}</div>`;
                    list.appendChild(div);
                });
                list.scrollTop = list.scrollHeight;
            });
        }
    </script>
</body>
